<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>배양공정 기술이전</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f5;color:#163932;font:16px/1.5 "Malgun Gothic",Arial,sans-serif}header{background:#114c42;color:white;padding:18px max(5vw,20px);font-weight:bold;letter-spacing:.03em}main{max-width:1020px;margin:auto;padding:40px 20px}h1{font-size:clamp(28px,4vw,42px);letter-spacing:-.06em;margin:0}p{color:#516760}section{margin:24px 0;background:white;border:1px solid #cbdad5;border-radius:14px;overflow:hidden}h2{font-size:20px;margin:0;padding:18px 20px;background:#dfede7}small{font-size:14px;color:#527267}article{padding:10px 20px;display:grid;grid-template-columns:2fr 1fr 1fr;align-items:center;gap:14px;border-top:1px solid #e2ebe7}label{display:flex;gap:10px;align-items:center;cursor:pointer}input[type=checkbox]{width:18px;height:18px;accent-color:#13775d;flex:none}input[type=text]{font:inherit;width:100%;border:1px solid #91afa2;border-radius:6px;padding:8px}input:disabled{background:#f4f6f5;border-color:#e7ece9}article:has(:checked){background:#f3fbf6}.head{font-weight:bold;font-size:14px;color:#546b62}output{font-weight:bold;color:#126a51}@media(max-width:620px){article{grid-template-columns:1fr 1fr;padding:12px}label{grid-column:span 2}.head{display:none}h2{font-size:18px}}
button,select{font:inherit;border:1px solid #87a99d;background:white;padding:8px;border-radius:6px}button{cursor:pointer}#create{background:#175e50;color:white}aside{padding:18px;background:#eff7f4}aside p{margin:6px 0}.diameter-label{padding-left:32px}@media(max-width:620px){.diameter-label{grid-column:span 2;padding-left:0}}nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}nav button{padding:7px 15px}nav button[aria-pressed=true]{background:#175e50;color:white}#commit{background:#175e50;color:white;padding:11px 24px}.sheet{width:100%;table-layout:fixed;border-collapse:collapse}.sheet th,.sheet td{text-align:left;padding:10px;border-top:1px solid #dbe5df;overflow-wrap:anywhere}.sheet th:first-child{width:44%}#summary h3,#summary p{margin:16px}.sheet-formula{display:block;margin-top:4px;font-size:.875rem;line-height:1.45}.ru-entry{display:flex;align-items:center;gap:5px}.ru-entry input{min-width:0}.ru-entry button,#summary h3 button{white-space:nowrap;font-size:13px;padding:6px}#summary h3 button{float:right}@media(max-width:620px){.ru-entry{flex-wrap:wrap}}.ru-entry{flex-wrap:wrap}.ru-entry label{font-size:14px;gap:2px}.ru-entry input[type=text]{flex:1 1 90px}.ru-entry:has(.ru-actions){display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center}.ru-actions{display:grid;gap:4px}.ru-actions button[aria-pressed=true]{background:#175e50;color:white;border-color:#175e50}</style><header>배양공정 기술이전 Intelligence</header><main><h1>배양공정 기술이전</h1><p>이번 기술이전에서 입력하거나 계산할 항목을 체크하고, SU·RU 값을 입력한 뒤 공정별로 저장하세요.</p><section style="padding:18px"><label>저장된 프로젝트 <select id="projects"></select></label><p><label>프로젝트명 <input id="projectName" type="text" maxlength="100"></label></p><button id="rename">이름 저장</button> <button id="create">입력한 이름으로 새 프로젝트</button> <small id="status" role="status"></small></section><nav aria-label="화면 선택"><button id="editView">공정 입력</button><button id="sheetView">저장된 시트</button></nav><div id="editor"><nav id="tabs" aria-label="공정 선택"></nav><output id="count" aria-live="polite"></output><div id="groups"></div><button id="commit">현재 공정 저장</button></div><div id="summary" hidden></div></main><script>
const categories=[
['Agitation & Equipment','교반 및 장비',['Shaker RPM','Shaker Orbital Diameter','Flask Nominal Volume','Flask Working Volume','Fill Ratio','Flask Geometry','Flask Closure Type','Incubator Temperature','Incubator CO₂ Concentration']],
['Cell Growth','세포 성장',['Initial VCD','Initial Viability','Final VCD','Final Viability','Culture Duration','Specific Growth Rate (μ)','Doubling Time (DT)','Total Viable Cells','Inoculation Volume','Inoculum Hold Time']]];
const key='flask-projects-v2';
let book;
try{book=JSON.parse(localStorage.getItem(key))}catch{}
if(!book){
 let legacy={};try{legacy=JSON.parse(localStorage.getItem('flask-transfer-sheet-v1'))||{}}catch{}
 book={active:'first',entries:{first:{name:'첫 프로젝트',data:legacy}}};
}
let data;
const msg=document.querySelector('#status');
function save(){try{localStorage.setItem(key,JSON.stringify(book));msg.textContent='입력 내용 임시 저장됨';return true}catch{msg.textContent='브라우저 저장 실패';return false}}
function changeProject(createNew){
 const name=projectName.value.trim();
 if(!name||Object.entries(book.entries).some(([id,p])=>(createNew||id!==book.active)&&p.name===name)){msg.textContent='중복되지 않는 프로젝트명을 입력하세요';return}
 if(createNew){book.active=crypto.randomUUID();book.entries[book.active]={name,data:{}}}
 else book.entries[book.active].name=name;
 render();save()
}
create.onclick=()=>changeProject(true);rename.onclick=()=>changeProject(false);
projects.onchange=()=>{book.active=projects.value;render();save()};
const stages=['Flask','Wave','STR','Stainless','Harvest','Centrifuge'];
const shaker={speed:'Shaker RPM',dimension:'Shaker Orbital Diameter',symbol:'궤도 직경',unit:'mm',basis:'동일 궤도 가속도 기준',note:'SU와 RU의 플라스크 형상(Geometry)이 같다고 가정합니다.'};
const centrifuge={speed:'Centrifuge RPM',dimension:'Rotor Radius',symbol:'로터 반경',unit:'cm',basis:'동일 상대원심력(RCF) 기준',note:'양측 모두 같은 기준 위치에서 측정한 로터 반경(cm)을 입력하세요. RCF(×g) = 1.118 × 10⁻⁵ × 반경(cm) × RPM².'};
const stageFields={Wave:['장비 모델','배양백 규격','작업 부피','Rocking Rate','Rocking Angle'],STR:['장비 모델','작업 부피','임펠러 형상','교반 속도'],Stainless:['설비 ID','공칭 부피','작업 부피','임펠러 형상','교반 속도'],Harvest:['수확 방법','수확 부피','수확 소요 시간','회수율'],Centrifuge:['원심분리기 모델','로터 모델','처리 부피','원심분리 시간']};
const positive=v=>/^(?:\d+(?:\.\d*)?|\.\d+)$/.test(v.trim())&&Number(v)>0&&Number.isFinite(Number(v));
function section(title){
 const el=document.createElement('section');groups.append(el);
 el.innerHTML='<h2>'+title+'</h2><article class="head"><span>분석 항목</span><span>SU · 이전 측</span><span>RU · 도입 측</span></article>';
 return el
}
function tally(){
 count.textContent='선택한 항목 '+groups.querySelectorAll('.item-select:checked').length+' / '+groups.querySelectorAll('.item-select').length
}
function record(name){return data[name]??={selected:false,SU:'',RU:''}}
function row(parent,name,labelText,dependent=false){
 const item=record(name),el=document.createElement('article');parent.append(el);
 const label=document.createElement(dependent?'span':'label');el.append(label);
 const check=dependent?null:document.createElement('input');
 if(check){check.type='checkbox';check.className='item-select';check.checked=item.selected;label.append(check)}
 else label.className='diameter-label';
 label.append(labelText);
 const fields=['SU','RU'].map(side=>{
 const field=document.createElement('input');field.type='text';field.value=item[side];field.placeholder=side+' 값';field.setAttribute('aria-label',side+' '+labelText);el.append(field);
 field.oninput=()=>{item[side]=field.value;el.dispatchEvent(new Event('edit'));save()};
 return field});
 const cell=document.createElement('div');cell.className='ru-entry';
 fields[1].replaceWith(cell);cell.append(fields[1]);
 const calculated=name===shaker.speed||name===centrifuge.speed;
 let syncControls=()=>{};
 if(dependent && item.tbd){item.RU='';item.tbd=false;fields[1].value=''}
 if(!calculated && !dependent){
   const actions=document.createElement('div');actions.className='ru-actions';cell.append(actions);
   const copy=document.createElement('button'),tbd=document.createElement('button');
   copy.type=tbd.type='button';copy.textContent='SU값과 동일';tbd.textContent='TBD';
   copy.setAttribute('aria-label',labelText+' RU에 SU값 복사');tbd.setAttribute('aria-label',labelText+' RU 미정');
   actions.append(copy,tbd);
   syncControls=()=>{
     copy.disabled=fields[1].disabled||!fields[0].value.trim();
     tbd.disabled=fields[1].disabled;tbd.setAttribute('aria-pressed',String(!!item.tbd));
     fields[1].readOnly=!!item.tbd;
     fields[1].value=item.tbd?'TBD':item.RU;
   };
   copy.onclick=()=>{item.tbd=false;item.RU=fields[0].value;el.dispatchEvent(new Event('edit'));save()};
   tbd.onclick=()=>{item.tbd=!item.tbd;el.dispatchEvent(new Event('edit'));save()};
   el.addEventListener('edit',syncControls);
 }
 function enable(on){for(const field of fields)field.disabled=!on;syncControls()}
 enable(item.selected);
 if(check)check.onchange=()=>{item.selected=check.checked;enable(item.selected);el.dispatchEvent(new Event('edit'));tally();save()};
 return {el,item,fields,enable}
}
function calculator(config){
 const {speed,dimension,symbol,unit,basis,note}=config;
 const panel=section(speed+' 계산'),rpm=row(panel,speed,speed),param=row(panel,dimension,symbol+' ('+unit+')',true);
 const output=rpm.fields[1];output.readOnly=true;output.placeholder='자동 계산';
 const foot=document.createElement('aside');panel.append(foot);
 foot.innerHTML='<b>'+basis+'</b><p>SU RPM × √(SU '+symbol+' / RU '+symbol+') = RU RPM</p><output aria-live="polite"></output><p><small>※ '+note+'</small></p>';
 function refresh(){
 const active=rpm.item.selected;param.enable(active);
 const inputs=[rpm.item.SU,param.item.SU,param.item.RU];
 const value=active&&inputs.every(positive)?Number(inputs[0])*Math.sqrt(Number(inputs[1])/Number(inputs[2])):NaN;
 const pending=active&&param.item.tbd; const valid=!pending&&Number.isFinite(value)&&value>0;
 output.value=valid?String(Number(value.toPrecision(6))):'';
 rpm.item.calculatedRU=output.value;
 foot.querySelector('output').textContent=pending?'계산 대기 · RU '+symbol+'을 입력하세요.':valid?inputs[0]+' × √('+inputs[1]+' / '+inputs[2]+') = '+output.value+' rpm':speed+'을 선택하고 SU RPM과 양측 '+symbol+'을 양수로 입력하세요.'
 }
 rpm.el.addEventListener('edit',refresh);param.el.addEventListener('edit',refresh);refresh()
}
let viewingSheet=false;
function selectedRows(stage,values){
 const rows=[];
 function add(name,su,ru){rows.push({name,su,ru})}
 const configs=stage==='Flask'?[shaker,centrifuge]:stage==='Centrifuge'?[centrifuge]:[];
 for(const c of configs){
   const speed=values[c.speed],param=values[c.dimension];
   if(speed?.selected){
     add(c.speed,speed.SU,speed.calculatedRU||'계산 대기');
     add(c.symbol+' ('+c.unit+')',param?.SU,param?.tbd?'TBD':param?.RU);
   }
 }
 const names=stage==='Flask'?[...categories[0][2].filter(n=>![shaker.speed,shaker.dimension,'Flask Geometry'].includes(n)),...categories[1][2]]:stageFields[stage];
 for(const name of names){const item=values[name];if(item?.selected)add(name,item.SU,item.tbd?'TBD':item.RU)}
 return rows
}
function editSaved(project,stage,snapshot){
 const draft=stage==='Flask'?project.data:(project.stages[stage]??={});
 const current=selectedRows(stage,draft);
 if(JSON.stringify(current)!==JSON.stringify(snapshot) &&
    !confirm('현재 공정의 임시 입력과 저장된 시트가 다릅니다. 저장된 시트 값으로 편집을 시작할까요?'))return;
 for(const entry of Object.values(draft))entry.selected=false;
 for(const saved of snapshot){
   const dimension=[shaker,centrifuge].find(c=>saved.name===c.symbol+' ('+c.unit+')');
   const name=dimension?dimension.dimension:saved.name;
   const item=draft[name]??={};
   item.tbd=saved.ru==='TBD';if(name===shaker.speed||name===centrifuge.speed)item.tbd=!!saved.explicitTbd;item.selected=!dimension;item.SU=saved.su??'';
   if(name!==shaker.speed && name!==centrifuge.speed)item.RU=item.tbd?(item.RU||''):(saved.ru??'');
 }
 project.stage=stage;viewingSheet=false;render();save();
 document.querySelector('#editor').scrollIntoView({block:'start'})
}
function drawSummary(project){
 summary.replaceChildren();
 const heading=document.createElement('h2');heading.textContent=project.name+' · 저장된 시트';summary.append(heading);
 for(const stage of stages){
   const panel=document.createElement('section'),title=document.createElement('h3');title.textContent=stage;panel.append(title);summary.append(panel);
   const snapshot=project.sheets?.[stage];
   if(snapshot){
     const edit=document.createElement('button');edit.textContent='수정';
     edit.setAttribute('aria-label',stage+' 저장값 수정');edit.onclick=()=>editSaved(project,stage,snapshot);title.append(edit)
   }
   if(!snapshot?.length){const note=document.createElement('p');note.textContent='이번 기술이전에서 수행하지 않는 공정입니다.';panel.append(note);continue}
   const table=document.createElement('table');table.className='sheet';table.innerHTML='<thead><tr><th>선택 항목 및 계산 입력</th><th>SU · 이전 측</th><th>RU · 도입 측</th></tr></thead>';panel.append(table);
   const body=table.createTBody();
   for(const item of snapshot){
     const tr=body.insertRow();
     for(const value of [item.name,item.su,item.ru])tr.insertCell().textContent=value||'미입력';
     const config=[shaker,centrifuge].find(c=>c.speed===item.name);
     if(!config)continue;
     const dimension=snapshot.find(r=>r.name===config.symbol+' ('+config.unit+')');
     const formula=document.createElement('small');
     formula.className='sheet-formula';
     formula.textContent='SU RPM × √(SU '+config.symbol+' / RU '+config.symbol+') = RU RPM';
     tr.cells[2].append(formula);
     if(dimension && [item.su,dimension.su,dimension.ru,item.ru].every(v=>v && Number.isFinite(Number(v)) && Number(v)>0)){
       const expression=document.createElement('small');
       expression.className='sheet-formula';
       expression.textContent=item.su+' × √('+dimension.su+' / '+dimension.ru+') = '+item.ru+' rpm';
       tr.cells[2].append(expression);
     }
   }
 }
}
function showView(sheet){
 viewingSheet=sheet;editor.hidden=sheet;summary.hidden=!sheet;
 editView.setAttribute('aria-pressed',String(!sheet));sheetView.setAttribute('aria-pressed',String(sheet));
 if(sheet)drawSummary(book.entries[book.active])
}
editView.onclick=()=>showView(false);sheetView.onclick=()=>showView(true);
commit.onclick=()=>{
 const project=book.entries[book.active],stage=project.stage||'Flask';
 project.sheets??={};const prior=project.sheets[stage];
 project.sheets[stage]=selectedRows(stage,data);
 if(save()){showView(true);msg.textContent=stage+' 공정을 시트에 저장했습니다.';sheetView.focus()}
 else if(prior===undefined)delete project.sheets[stage];else project.sheets[stage]=prior
};
function render(){
 const project=book.entries[book.active],stage=project.stage||'Flask';
 projects.replaceChildren();for(const [id,p] of Object.entries(book.entries))projects.add(new Option(p.name,id));
 projects.value=book.active;projectName.value=project.name;
 project.stages??={};data=stage==='Flask'?project.data:(project.stages[stage]??={});
 tabs.replaceChildren();for(const name of stages){
 const button=document.createElement('button');button.textContent=name;button.setAttribute('aria-pressed',String(name===stage));tabs.append(button);
 button.onclick=()=>{project.stage=name;render();save()}
 }
 groups.replaceChildren();
 if(stage==='Flask')calculator(shaker);
 if(stage==='Flask'||stage==='Centrifuge')calculator(centrifuge);
 const lists=stage==='Flask'?[[categories[0][0],categories[0][2].filter(n=>![shaker.speed,shaker.dimension,'Flask Geometry'].includes(n))],[categories[1][0],categories[1][2]]]:[[stage+' 기술이전 항목',stageFields[stage]]];
 for(const [title,names] of lists){const panel=section(title);for(const name of names)row(panel,name,name)}
 tally()
 showView(viewingSheet)
}
render();
</script></html>
